@if (isOpen()) {
  <task-context-menu-inner
    #taskContextMenuInner
    [isAdvancedControls]="isAdvancedControls()"
    [isPlannerGroupSelectable]="isPlannerGroupSelectable()"
    (close)="onClose()"
    (selectPlannerGroup)="selectPlannerGroup.emit()"
    [task]="task()"
  ></task-context-menu-inner>
}
