@if (hintPosition(); as pos) {
  @let step = onboardingHintService.currentStep();
  <div
    class="hint-container"
    role="region"
    [attr.aria-label]="hintMessage() | translate: hintMessageParams()"
    [style.top.px]="pos.top"
    [style.left.px]="pos.left"
  >
    <div
      class="hint-arrow"
      [class.arrow-up]="pos.arrowDirection === 'up'"
      [class.arrow-down]="pos.arrowDirection === 'down'"
      [style.left.px]="pos.arrowOffset"
    ></div>
    <div
      #hintChipEl
      class="hint-chip"
    >
      <div class="hint-text">
        @if (hintMessage()) {
          <div class="hint-message">
            {{ hintMessage() | translate: hintMessageParams() }}
          </div>
        }
        @if (shortcutHint(); as shortcut) {
          <span class="shortcut-hint">
            {{ T.ONBOARDING.HINTS.OR_PRESS | translate }} <kbd>{{ shortcut }}</kbd>
          </span>
        }
        @if (step === 'track-offer') {
          <div class="hint-buttons">
            <button
              mat-button
              type="button"
              class="e2e-onboarding-simplify"
              (click)="simplify()"
            >
              {{ T.ONBOARDING.HINTS.SIMPLIFY | translate }}
            </button>
          </div>
        }
      </div>
      <button
        type="button"
        class="close-btn"
        [attr.aria-label]="T.ONBOARDING.HINTS.SKIP_ARIA | translate"
        (click)="skip()"
      >
        <span aria-hidden="true">✕</span>
      </button>
    </div>
  </div>
}
